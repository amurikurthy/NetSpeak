# netspeak: one container, one port, one volume. No database, no other services.
# Put your reverse proxy in front of it (it must pass WebSockets and keep the Host header).
#
#   docker compose up -d
#   docker compose logs netspeak      # shows the generated admin password on first start
services:
  netspeak:
    image: ghcr.io/amurikurthy/netspeak:latest
    container_name: netspeak
    restart: unless-stopped
    ports:
      - "443:443"                     # HTTPS with a self-signed cert; your proxy terminates the real one
    volumes:
      - ./data:/data                  # users, rooms, keys: back this folder up
    environment:
      NETSPEAK_ADMIN_PASSWORD: ""     # first start only. Empty = random, printed in `docker compose logs netspeak`
      # Prefer plain HTTP between proxy and container? Set the next line, change the port mapping
      # above to "8080:8080", and point the proxy at http://netspeak:8080
      # NETSPEAK_TLS: "off"
