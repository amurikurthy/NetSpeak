<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>NetSpeak</title>
<meta name="theme-color" content="#0b0d12">
<meta name="description" content="Self-hosted intercom with program feeds">
<!-- use-credentials: send cookies / basic-auth with the manifest request. Without it a proxy that requires a login blocks the manifest and the app cannot be installed. -->
<link rel="manifest" href="/manifest.webmanifest" crossorigin="use-credentials">
<link rel="icon" href="/icons/favicon.svg" type="image/svg+xml">
<link rel="icon" href="/icons/favicon-32.png" type="image/png" sizes="32x32">
<link rel="icon" href="/icons/favicon-48.png" type="image/png" sizes="48x48">
<link rel="shortcut icon" href="/icons/favicon.ico">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<link rel="apple-touch-icon" sizes="167x167" href="/icons/apple-touch-icon-167.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="NetSpeak">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="stylesheet" href="/style.css">
</head>
<body>
<div id="app"></div>
<div id="toasts" aria-live="polite"></div>
<noscript>NetSpeak needs JavaScript.</noscript>
<script type="module" src="/app.js"></script>
</body>
</html>
