# netspeak: one container, one port (443), one volume. No database, no other services.
#
#   docker compose up -d
#   docker compose logs netspeak      # shows the generated admin password on first start
#
# Settings go in a .env file next to this one (see .env.example), no YAML editing needed.
services:
  netspeak:
    image: ghcr.io/amurikurthy/netspeak:${NETSPEAK_VERSION:-latest}
    build: .                          # used by `docker compose up -d --build` from a git clone
    container_name: netspeak
    restart: unless-stopped
    ports:
      - "443:443"                     # the ONLY port. Web app, API and all audio use it.
    volumes:
      - ./data:/data                  # users, rooms, certificates
    environment:
      NETSPEAK_DOMAIN: ${NETSPEAK_DOMAIN:-}            # public hostname -> automatic trusted HTTPS
      NETSPEAK_ADMIN_PASSWORD: ${NETSPEAK_ADMIN_PASSWORD:-}
      NETSPEAK_EMAIL: ${NETSPEAK_EMAIL:-}
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    security_opt: ["no-new-privileges:true"]
